<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="officeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background Medallion -->
  <rect width="512" height="512" rx="96" fill="#16191f"/>
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#282c34" stroke-width="4"/>

  <!-- Folded Document Base -->
  <path d="M144 96 H304 L384 176 V400 H144 Z" fill="url(#officeGrad)" rx="8"/>

  <!-- Document Fold Corner -->
  <path d="M304 96 V176 H384 Z" fill="#1e40af"/>

  <!-- Document Content Bars -->
  <rect x="184" y="220" width="144" height="18" rx="9" fill="#ffffff" opacity="0.95"/>
  <rect x="184" y="260" width="144" height="18" rx="9" fill="#ffffff" opacity="0.85"/>
  <rect x="184" y="300" width="96" height="18" rx="9" fill="#ffffff" opacity="0.75"/>

  <!-- Productivity Orbit Accent -->
  <circle cx="360" cy="350" r="32" fill="url(#accentGrad)"/>
  <path d="M350 350 L358 358 L374 340" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>