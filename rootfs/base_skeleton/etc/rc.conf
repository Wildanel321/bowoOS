# /etc/rc.conf: OpenRC system configuration for Lite Office OS

# Parallel service startup for maximum boot speed
rc_parallel="YES"

# Dependency strictness
rc_depend_strict="NO"

# Disable service logger daemon to eliminate RAM and disk I/O overhead
rc_logger="NO"

# Enable Unicode terminal support
unicode="YES"

# Drop down to a shell if an essential sysinit service fails
rc_shell_on_failed="YES"

# Caching mode for services
rc_caching="YES"
