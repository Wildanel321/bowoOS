# /etc/sysctl.d/99-lowmem.conf — Memory Optimization for Lite Office OS

# Aggressive memory swapping into compressed ZRAM
vm.swappiness = 100

# Retain directory and inode cache longer to reduce disk access latencies
vm.vfs_cache_pressure = 50

# Flusher thread threshold tuning for low-end storage
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# Zero out page cluster readahead (ideal for compressed ZRAM random access)
vm.page-cluster = 0

# Reboot on kernel panic after 10 seconds
kernel.panic = 10
