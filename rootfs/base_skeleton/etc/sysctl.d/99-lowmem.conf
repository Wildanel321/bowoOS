# ==============================================================================
# LiteOffice OS — Low-Memory Kernel Sysctl Configuration
# Optimized for 512 MB to 2 GB RAM personal computers and slow storage devices
# ==============================================================================

# Aggressive memory swapping into fast compressed ZRAM swap
vm.swappiness = 100

# Retain directory and inode cache longer to reduce disk access latencies
vm.vfs_cache_pressure = 50

# Flusher thread threshold tuning for low-end storage (flushes early in small batches)
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# Single-page swap I/O (eliminates readahead latency in compressed RAM swap)
vm.page-cluster = 0

# Prevent memory compaction boost latency spikes on low-end CPUs
vm.watermark_boost_factor = 0

# Emergency headroom reserved for network buffers and atomic kernel allocations
vm.min_free_kbytes = 8192

# Restrict kernel logging printk rate to reduce console & serial memory overhead
kernel.printk = 3 4 1 3

# Reboot automatically on unrecoverable kernel panic after 10 seconds
kernel.panic = 10
